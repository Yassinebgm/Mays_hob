<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deux destins, un chemin vers la lune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Symbole de chat réutilisé deux fois -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="cat-shape" viewBox="0 0 64 56">
      <path d="M8 50c-6-2-8-10-3-14 3-2 5 0 3 3-1 3 1 6 5 6z"/>
      <ellipse cx="30" cy="40" rx="20" ry="12"/>
      <circle cx="46" cy="24" r="11"/>
      <path d="M37 18l1-12 8 7zM55 18l-1-12-8 7z"/>
    </symbol>
    <symbol id="cat-back" viewBox="-3 0 61 80">
      <path d="M4 73C1 58 7 44 15 40H29C38 44 45 58 41 73C38 79 6 79 4 73Z" fill="currentColor"/>
      <ellipse cx="22" cy="29" rx="14.5" ry="12" fill="currentColor"/>
      <path d="M9.5 24C8 16 8.5 9 10.5 4C14 5 19 9 21 14Z" fill="currentColor"/>
      <path d="M34.5 24C36 16 35.5 9 33.5 4C30 5 25 9 23 14Z" fill="currentColor"/>
      <path d="M40 74C52 74 53 62 51 54C50 49 52 46 54.5 46" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"/>
      <path d="M8 30L-1.5 28M8 32.5L-2 33.5M36 30L45.5 28M36 32.5L46 33.5" stroke="currentColor" stroke-width=".6" stroke-linecap="round" opacity=".55"/>
    </symbol>
  </svg>

  <main class="journey">

    <!-- Monde vertical, 3× la hauteur de l'écran : la « caméra » le fait glisser -->
    <div class="sky" id="sky">

      <div class="stars" id="stars" aria-hidden="true"></div>

      <div class="destination" id="destination">
        <div class="moon" id="moon">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="moonGrad" x1="0.2" y1="0" x2="0.9" y2="1">
                <stop offset="0" stop-color="#fff8e3"/><stop offset="1" stop-color="#ebcd94"/>
              </linearGradient>
              <clipPath id="moonClip"><path d="M29.7 0.5C50 2.5 68 16 79 34C85 46 86 62 83 74C80 86 70 94 56 98C44 101 28 99 14 95C28 93.5 50 90 66 88.6C69.5 88.3 70.6 86.5 70.4 82C70 74 69 70 67.5 66C65 56 66 42 62 30C58 17 46 8 29.7 0.5Z"/></clipPath>
            </defs>
            <!-- Croissant vertical ouvert vers la gauche ; sa corne basse forme le banc des chats -->
            <path d="M29.7 0.5C50 2.5 68 16 79 34C85 46 86 62 83 74C80 86 70 94 56 98C44 101 28 99 14 95C28 93.5 50 90 66 88.6C69.5 88.3 70.6 86.5 70.4 82C70 74 69 70 67.5 66C65 56 66 42 62 30C58 17 46 8 29.7 0.5Z" fill="url(#moonGrad)" stroke="#ffc477" stroke-opacity=".55" stroke-width=".6"/>
            <g clip-path="url(#moonClip)" fill="#c9a25e" opacity=".16">
              <circle cx="77" cy="46" r="4.5"/><circle cx="74" cy="62" r="3"/>
              <circle cx="70" cy="28" r="2.6"/><circle cx="80" cy="34" r="1.8"/><circle cx="62" cy="94" r="3"/>
            </g>
          </svg>
          <!-- Les deux chats, de dos, assis côte à côte sur la lune (visibles à la fin) -->
          <div class="moon-cats" aria-hidden="true">
            <svg class="moon-cat cat-roux"><use href="#cat-back"/></svg>
            <svg class="moon-cat cat-nuit"><use href="#cat-back"/></svg>
          </div>
        </div>
      </div>

      <svg class="paths" viewBox="0 0 100 300" preserveAspectRatio="none" aria-hidden="true">
        <path class="path-left"  id="pathLeft"  d=""/>
        <path class="path-right" id="pathRight" d=""/>
      </svg>

      <svg class="hills" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 8C20 2 35 10 55 5S85 3 100 7V20H0Z" fill="#6b3a5a"/>
        <path d="M0 13C25 8 40 15 65 11S90 10 100 12V20H0Z" fill="#3f2748"/>
      </svg>

      <div class="starting-point" aria-hidden="true">
        <svg class="cat cat-left"><use href="#cat-shape"/></svg>
        <svg class="cat cat-right"><use href="#cat-shape"/></svg>
      </div>
    </div>

    <p class="footer-note">Deux destins, un chemin vers la lune</p>

    <!-- Invocation : apparaît à l'arrivée, quand les fils se rejoignent -->
    <div class="invocation" id="invocation">
      <p class="dua-ar" lang="ar" dir="rtl">اللَّهُمَّ إِنْ كَانَ فِي ذَلِكَ خَيْرٌ لَنَا فَيَسِّرْهُ لَنَا</p>
      <span class="dua-line" aria-hidden="true"></span>
      <p class="dua-fr" lang="fr">« Ô Allah, si cela est un bien pour nous, facilite-le-nous. »</p>
      <p class="dua-mark" aria-hidden="true">🤍🌙</p>
    </div>

    <section class="question-card" id="card" aria-live="polite"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
